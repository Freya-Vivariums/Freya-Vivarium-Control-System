# --------------------------------------------------------------------------------
# freya.conf — Freya Vivarium Control System overrides for Node-RED service
#
# Purpose:
#   - Point Node-RED at the Freya settings and data directories
#   - Inject Freya-specific environment variables
#   - Start Node-RED after Edgeberry Core
#
# Location: /etc/systemd/system/nodered.service.d/freya.conf
# Maintainer:  Sanne “SpuQ” Santens
# Created:     2025-07-11
#
# NOTE: Any changes here take precedence over the upstream unit in
#       /lib/systemd/system/nodered.service.
# --------------------------------------------------------------------------------

[Unit]
Description=Node-RED for Freya Vivarium Control System

# Start after Edgeberry Core.
#
# The flow publishes the application info - including the routes the Edgeberry
# interface uses to reach the dashboard and the editor - from an inject that
# fires shortly after the flow starts. Edgeberry Core registers the application
# from /opt/Freya/edgeberry.json when it starts, and that manifest deliberately
# carries no routes, because the flow owns them. Whichever of the two happens
# last wins, so on a cold boot where Node-RED started first the routes were
# overwritten and the interface showed "No application running".
#
# Ordering Node-RED after Core puts Core's manifest registration before the
# flow's, and Node-RED spends more than ten seconds loading its palette after
# that, which leaves a wide margin.
#
# Wants, not Requires: Node-RED runs the vivarium. It must keep controlling
# lighting, heating, misting and fans even if Edgeberry Core is stopped or
# fails - only the web interface depends on Core, never the climate.
Wants=io.edgeberry.core.service
After=io.edgeberry.core.service

[Service]
ExecStart=
ExecStart=/usr/bin/env node-red-pi --userDir /opt/Freya/nodered $NODE_OPTIONS -- $NODE_RED_OPTIONS
